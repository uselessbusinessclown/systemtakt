# Der Quellcode ist bewusst dicht geschrieben (Analyseskripte, keine Bibliothek).
# Die Prüfung beschränkt sich deshalb auf das, was tatsächlich bricht:
# Syntaxfehler, undefinierte Namen, kaputte f-Strings, falsche Vergleiche.
target-version = "py311"
line-length = 120

[lint]
select = ["E9", "F63", "F7", "F82", "F821", "F811"]

[lint.per-file-ignores]
# Der Pfad-Bootstrap muss vor allen weiteren Importen laufen.
"src/**/*.py" = ["E402"]
"backtest/*.py" = ["E402"]
